<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<title>Questionário · Academia Hu Xiaofei</title>
<style>
:root{--ink:#231910;--muted:#6e6256;--line:#e6d9c8;--tea:#3a5f4b;--cin:#8f3d2c;--paper:#fffaf2;--card:#fff;--soft:#eef4ef}
*{box-sizing:border-box}
html,body{margin:0;width:100%;overflow-x:hidden;background:#ece4d6;color:var(--ink);font:16px/1.45 -apple-system,"PingFang SC","PT Sans",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{width:100%;max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow-x:hidden}
header{padding:14px 18px 10px;border-bottom:1px solid var(--line);background:#fbf6ec;position:sticky;top:0;z-index:5;min-width:0}
main{flex:1;padding:16px 16px 24px;min-width:0;overflow-wrap:anywhere}
.kicker{margin:0;color:var(--tea);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.h1{margin:4px 0 0;font-size:18px;font-weight:750}
.bar{height:6px;background:#eadfce;border-radius:99px;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--tea);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
.sec{color:var(--cin);font-weight:750;font-size:13px;letter-spacing:.04em;margin:0 0 6px}
.note{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.q h2{margin:0 0 8px;font-size:16.5px}
.hint{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:99px;background:#f3eadc;color:var(--muted);font-size:11px;font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:0 0 8px;background:#fff;cursor:pointer}
.opt.on{border-color:var(--tea);background:var(--soft)}
.opt input{margin-top:3px;accent-color:var(--tea);width:18px;height:18px;flex:none}
.other{width:100%;margin-top:6px;border:none;border-bottom:1px solid #cbbba6;background:transparent;font:inherit;padding:6px 0}
textarea,.fill{width:100%;border:1px solid var(--line);border-radius:10px;background:#fffdf9;font:inherit;padding:10px;margin-top:6px}
textarea{min-height:90px}
.row{margin:0 0 12px}
.row b{display:block;margin:0 0 6px;font-size:14px}
select{width:100%;font:16px/1.4 inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff}
.nps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.nps button{padding:10px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:750;font-size:15px}
.nps button.on{background:var(--tea);color:#fff;border-color:var(--tea)}
.npscap{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}
.nav{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}
.nav button{flex:1;height:48px;border:0;border-radius:12px;font-size:16px;font-weight:750}
.back{background:#f3eadc;color:var(--ink)}
.next{background:var(--tea);color:#fff}
.intro p{margin:0 0 10px}
.hero{padding:8px 4px 4px}
.pill{display:inline-block;margin:0 6px 6px 0;padding:3px 9px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--muted)}
.ok{background:var(--soft);border:1px solid #c9d9ce;border-radius:14px;padding:16px}
.copy{margin-top:12px;width:100%;height:46px;border:0;border-radius:12px;background:var(--ink);color:#f4eadb;font-weight:750}
.err{color:var(--cin);font-size:13px;margin-top:8px}
.codewrap{margin:12px 0;padding:12px;border:1px dashed var(--tea);border-radius:12px;background:#fff}
.codelabel{font-size:13px;color:var(--muted)}
.code{font-size:28px;font-weight:750;letter-spacing:.08em;min-height:1.2em;margin:6px 0;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
<header>
  <p class="kicker">Hu Xiaofei Academy</p>
  <div class="h1" id="htitle"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="meta"><span id="step"></span><span>sem nome</span></div>
</header>
<main id="main"></main>
<div class="nav" id="nav"></div>
</div>
<script>
const DATA = [{"id": "q1", "n": 1, "type": "multi", "title": "Por que se inscreveram nesta viagem?", "hint": "pode escolher várias", "opts": ["Queria aprender práticas de daoyin com o mestre Hu Xiaofei / na Academia", "Queria viajar pela China e ver o país", "Queria descansar, recuperar-me e cuidar de mim sem pressa", "Queria conhecer o taoísmo / a vida num templo taoista", "Interessa-me a medicina chinesa e o cuidado da saúde", "O preço e as datas serviam-me"]}, {"id": "q2", "n": 2, "type": "single", "title": "De tudo isso, o que é o principal para si?", "hint": "uma resposta", "opts": [{"v": "gong", "l": "Aprender as práticas / vim pelo mestre ou pela Academia"}, {"v": "tour", "l": "Viajar pela China"}, {"v": "vac", "l": "Descanso e recuperação"}, {"v": "dao", "l": "Taoísmo / templo"}, {"v": "tcm", "l": "Medicina chinesa"}, {"v": "other", "l": "Outro"}]}, {"id": "q3", "n": 3, "type": "multi", "max": 2, "title": "O que mais quer ver na China?", "hint": "no máximo 2", "opts": ["Vida de cidade, ruas, a China de agora", "A vida de todos os dias, os costumes, como as pessoas vivem", "Montanhas, rios, natureza", "Templos taoistas, templos", "Museus, história, monumentos", "Ofícios (porcelana, chá, seda e outros)", "Jardins, vilas antigas"]}, {"id": "q4", "n": 4, "type": "single", "title": "Como prefere ver a China?", "hint": "uma resposta", "opts": ["Ficar mais tempo numa cidade e passear sem pressa", "Ir a várias cidades e ficar pouco em cada uma", "Um lugar por dia, mas visto com calma", "De manhã e à tarde, sítios diferentes, para ver o máximo possível"]}, {"id": "q5", "n": 5, "type": "multi", "title": "O que menos quer numa viagem?", "hint": "pode escolher várias", "opts": ["Correr de monumento em monumento, só para riscar a lista", "Não ter tempo para passear por minha conta", "Lugares que não têm nada a ver com a prática e a saúde", "Explicações longas demais, muito tempo em pé a ouvir", "Ir a um sítio que a mim não interessa"]}, {"id": "q6", "n": 6, "type": "single", "title": "O que mais quer levar das práticas?", "hint": "uma resposta", "opts": ["Aprender bem 1 ou 2 séries, para praticar em casa", "Experimentar várias séries; uma ideia geral chega", "Que o mestre me corrija os movimentos em pessoa", "Entender o sentido (respiração, meridianos, saúde)", "Praticar num templo ou entre montanhas: o ambiente importa"]}, {"id": "q7", "n": 7, "type": "single", "title": "Como convém organizar as aulas?", "hint": "uma resposta", "opts": ["Cada dia um pouco, mas bem feito, e que sobre tempo livre", "Prática de manhã; à tarde, saída ou tempo livre", "De manhã e à tarde, para aprender com mais base", "Uns dias de prática intensa, e os outros quase sem prática"]}, {"id": "q8", "n": 8, "type": "multi", "title": "O que precisa na aprendizagem?", "hint": "pode escolher várias", "opts": ["Chega-me praticar com o grupo grande", "Mais aulas individuais ou em grupo pequeno", "Esquemas, comandos ou vídeos para rever em casa", "Que expliquem a teoria, não só os movimentos", "Um certificado ou outro resultado que se possa mostrar"]}, {"id": "q9", "n": 9, "type": "single", "title": "Num descanso, que dia ideal se parece mais consigo?", "hint": "uma resposta", "opts": ["Levantar-me mais tarde, praticar um pouco, e o dia quase livre", "Prática de manhã, e depois um bom pedaço do dia para mim", "Meia jornada de aula e meia jornada de descanso a sério", "Quase sem prática: o principal é dormir, a paisagem e um bom alojamento"]}, {"id": "q10", "n": 10, "type": "multi", "max": 2, "title": "O que é mais importante no descanso?", "hint": "no máximo 2", "opts": ["Boa cama, casa de banho e dormir com normalidade", "Águas termais, massagem, tratamentos de medicina chinesa", "O silêncio da montanha", "Viver na cidade, com facilidade para passear e comprar", "Sentar-me num café, passear, fazer fotos", "Um ambiente belo, com estilo"]}, {"id": "q11", "n": 11, "type": "multi", "title": "O que menos quer num descanso assim?", "hint": "pode escolher várias", "opts": ["Levantar-me cedo e sair todos os dias", "Um alojamento mau, sem poder dormir bem", "O dia cheio, sem tempo para estar sozinho", "Comida a que não estou habituado", "Esforço demais (caminhar muito, subir montanhas)"]}, {"id": "q12", "n": 12, "type": "single", "title": "Como quer aproximar-se de um templo taoista?", "hint": "uma resposta", "opts": ["Olhar e ouvir; não é preciso dormir no templo", "Posso ficar 1 ou 2 noites; o resto, num hotel", "Quero uns dias de recolhimento, a viver no templo", "Não quero viver num templo de todo"]}, {"id": "q13", "n": 13, "type": "matrix", "title": "Disto, o que «quer mesmo experimentar» e o que «entende, mas não quer viver assim»?", "rows": ["Prática da manhã e postura de pé", "Rito de bênção", "Comida simples, sem carne", "Poucas conversas, ambiente silencioso", "Condições de alojamento simples"], "cols": ["Quero experimentar", "Não quero", "Tanto faz"]}, {"id": "q14", "n": 14, "type": "single", "title": "Se no próximo ano só se puder fazer um formato, qual se aproxima mais de si?", "hint": "respondem todos · uma resposta", "opts": ["Várias cidades e um programa cheio. Nisso parece-se com esta viagem.", "Um estágio de prática a fundo: poucas mudanças, cada dia pratica-se a sério, o alojamento é cómodo e há poucos monumentos.", "Um descanso para cuidar de si: bom alojamento, prática mais leve, e muito tempo próprio de dia e de noite.", "Uma viagem cultural sem pressa: uma ou duas cidades, vive-se com mais calma; prática mais passeios por conta própria; intérprete quando for preciso."]}, {"id": "q15", "n": 15, "type": "single", "title": "Que impressão geral lhe deixa a viagem inteira?", "hint": "uma resposta", "opts": ["Muito mal", "Mais para mal", "Regular", "Mais para bem", "Muito bem"]}, {"id": "q16", "n": 16, "type": "matrix", "title": "Dê uma nota ao que já aconteceu. Se não participou, «Não participei».", "rows": ["Chegada e alojamento em Jinhua", "Templo de Huang Daxian", "«Os Doze Exercícios de Xiangudong para a Longevidade»", "Pingyang e o templo de Xiangudong (prática da manhã, abertura e visita)", "Os trajetos longos Jinhua–Pingyang e Pingyang–Quzhou", "Conversa sobre saúde e cultura taoistas, e o rito", "Hospital de medicina chinesa em Quzhou", "«Os Nove Movimentos de Yang Jizhou»", "Alojamento em Jingdezhen e a cerâmica (universidade, Huangyao e peça feita à mão)", "«Os Oito Movimentos da Porcelana Azul»", "Hongcun e a rua antiga de Tunxi", "Caminhada em Huangshan (subida pelo teleférico Yuping, descida por Yungu)", "Museu do chá Xieyuda", "Alojamento em Huangshan", "A volta (até Shanghai, ou descer em Quzhou no caminho)"], "cols": ["Muito mal", "Mais para mal", "Regular", "Mais para bem", "Muito bem", "Não participei"]}, {"id": "q17", "n": 17, "type": "multi", "max": 3, "title": "Com o que está mais insatisfeito nesta viagem?", "hint": "no máximo 3", "opts": ["As condições do alojamento", "Trajetos longos demais", "Pressa demais e pouco descanso", "Prática demais", "Pouca prática, ou não deu tempo de a aprender", "A comida", "O alojamento ou o programa no templo", "Falta de tempo livre", "Os próprios lugares visitados", "As explicações ou a organização"]}, {"id": "q18", "n": 18, "type": "multi", "max": 3, "title": "O que lhe deu mais, ou de que gostou mais, nesta viagem?", "hint": "no máximo 3", "opts": ["As aulas de prática em si", "O mestre / a Academia", "O ambiente e a cultura do templo", "O templo de Huang Daxian ou outros lugares já visitados", "Os companheiros e o ambiente do grupo", "A tradução e o cuidado de quem acompanha", "A comida", "O alojamento"]}, {"id": "q19", "n": 19, "type": "matrix", "title": "Do que já fizemos, o que convém no próximo ano?", "rows": ["Templo de Huang Daxian", "Templo de Xiangudong", "Conversa e rito taoistas", "Hospital de medicina chinesa em Quzhou", "Cerâmica em Jingdezhen", "Hongcun e Tunxi", "Caminhada em Huangshan", "Museu do chá Xieyuda", "Jantares de gala"], "cols": ["Convém repetir", "Tanto faz", "Melhor não repetir"]}, {"id": "q20", "n": 20, "type": "multi_fill", "title": "Se desta viagem só se pudesse deixar uma coisa e tirar outra:", "fills": ["O que mais quero manter", "O que é mais fácil de tirar", "O motivo (opcional)"]}, {"id": "q21", "n": 21, "type": "single", "title": "Em Huangshan houve uma caminhada longa: subir pelo teleférico Yuping e descer por Yungu. Para o próximo ano, o que se aproxima mais de si?", "hint": "uma resposta", "opts": ["Que continue como parte fixa da viagem", "Que seja opcional", "Melhor um percurso mais curto, ou pela parte de baixo", "Nesse dia, melhor descanso ou uma cidade"]}, {"id": "q22", "n": 22, "type": "single", "title": "Quantos dias lhe parecem adequados para um programa assim (sem os voos internacionais)?", "hint": "uma resposta", "opts": ["8–10 dias", "11–13 dias", "14 dias (como esta viagem)", "15 dias ou mais"]}, {"id": "q23", "n": 23, "type": "single", "title": "Em quantas cidades é mais cómodo pernoitar?", "hint": "uma resposta", "note": "Desta vez houve cerca de 6 pernoites: Jinhua, Pingyang, Quzhou, Jingdezhen, Huangshan e Shanghai. Algumas pessoas desceram em Quzhou na volta.", "opts": ["1 ou 2 bases, para viver com mais calma", "3 ou 4 cidades", "5 ou 6 cidades (perto desta vez)", "7 ou mais"]}, {"id": "q24", "n": 24, "type": "single", "title": "Quanto quer praticar por dia, em média?", "hint": "uma resposta", "opts": ["Quase não praticar; só experimentar de vez em quando", "Cerca de 1 hora", "Cerca de 1,5–2 horas", "Meia jornada", "De manhã e à tarde"]}, {"id": "q25", "n": 25, "type": "single", "title": "Ao aprender as práticas, o que se aproxima mais de si?", "hint": "uma resposta", "opts": ["Aprender bem 1 ou 2 séries e levá-las para casa", "Experimentar várias, cada uma por cima", "As duas coisas: uma série bem, e ainda conhecer outras"]}, {"id": "q26", "n": 26, "type": "multi", "title": "O que quer aprender ou aprofundar?", "hint": "pode escolher várias", "opts": ["«Os Doze Exercícios de Xiangudong para a Longevidade», que já estudámos", "«Os Nove Movimentos de Yang Jizhou», que já estudámos", "«Os Oito Movimentos da Porcelana Azul»", "Postura de pé (zhan zhuang)", "Taiji", "Prática sentada, respiração", "Teoria taoista do cuidado da saúde", "Meridianos e saúde na medicina chinesa"]}, {"id": "q27", "n": 27, "type": "single", "title": "Que dia ideal do próximo ano se aproxima mais de si?", "hint": "uma resposta", "opts": ["Prática cedo, e à tarde saídas", "Prática cedo, e o resto do dia livre", "Aulas de manhã e à tarde, estudo denso", "Levantar-me mais tarde, uma aula curta, e o resto como descanso"]}, {"id": "q28", "n": 28, "type": "single", "title": "Qual é a deslocação mais longa num dia que lhe é aceitável?", "hint": "uma resposta", "note": "Nesta viagem já houve: Jinhua–Pingyang cerca de 5 horas, Pingyang–Quzhou cerca de 5 horas, Quzhou–Jingdezhen cerca de 3 horas, Jingdezhen–Huangshan cerca de 2 horas, Huangshan–Shanghai cerca de 6 horas.", "opts": ["Não mais de 2 horas", "3–4 horas", "5–6 horas (como alguns dias desta viagem)", "Pode ser mais, se assim virmos mais lugares"]}, {"id": "q29", "n": 29, "type": "single", "title": "«Melhor uma cidade a menos do que mais de cinco horas no autocarro.» O que lhe parece?", "hint": "uma resposta", "opts": ["De acordo: o caminho cansa mais do que os próprios lugares", "Nem uma coisa nem outra: depende de o lugar valer a pena", "Não estou de acordo: importa mais ver mais"]}, {"id": "q30", "n": 30, "type": "single", "title": "Quanto tempo por dia precisa mesmo para si?", "hint": "uma resposta", "opts": ["Quase não preciso; fica-me bem ir com o grupo", "Depois do jantar, 1 ou 2 horas chegam", "Quero que cada dia, depois de comer, a tarde seja minha", "A cada 3 ou 4 dias, um dia inteiro livre"]}, {"id": "q31", "n": 31, "type": "multi", "max": 2, "title": "A que quer dedicar-se sobretudo no tempo livre?", "hint": "no máximo 2", "opts": ["Passear pela cidade e olhar as ruas", "Sentar-me num café ou num sítio tranquilo", "Compras", "Fotos", "Um museu ou um const answers = {};
let idx = 0;
const qIndex = Object.fromEntries(DATA.map(q => [q.id, q]));

function q2v(){
  const a = answers.q2;
  return a && a.v ? a.v : '';
}
function visiblePages(){
  const v = q2v();
  return PAGES.filter(p => !p.if || p.if === v);
}
function labelOf(o){ return (o && o.l) ? o.l : o; }
function valOf(o){ return (o && o.v) ? o.v : o; }

function render(){
  const pages = visiblePages();
  if(idx < 0) idx = 0;
  if(idx >= pages.length) idx = pages.length-1;
  const p = pages[idx];
  const pct = (idx) / Math.max(1, pages.length-1) * 100;
  document.getElementById('bar').style.width = pct + '%';

    document.getElementById('go').onclick = () => { idx++; render(); window.scrollTo(0,0); };

  if(p.kind === 'done'){
    document.getElementById('htitle').textContent = UI.done;
    main.innerHTML = `<div class="ok"><p><b>Agradecemos. As respostas ficaram guardadas. Já pode fechar a página.</b></p>

        <div class="code" id="codebox"></div>
        <p class="note" id="codenote">${esc(UI.codePending)}</p>

    const sum = formatSummary();
    document.getElementById('sum').value = sum;
    nav.innerHTML = `<button class="back" type="button" id="back">${esc(UI.back)}</button>`;
    document.getElementById('back').onclick = () => { idx--; render(); };
    document.getElementById('copy').onclick = async () => {
      try { await navigator.clipboard.writeText(sum); document.getElementById('msg').textContent = UI.copied; }
      catch(e){ document.getElementById('sum').select(); document.getElementById('msg').textContent = UI.copyManual; }
    };
    document.getElementById('copycode').onclick = async () => {
      const text = (document.getElementById('codebox').textContent || '').trim();
      if(!text) return;
      try { await navigator.clipboard.writeText(text); document.getElementById('msg').textContent = UI.copied; }
      catch(e){ document.getElementById('msg').textContent = UI.copyManual; }
    };
    submitAnswers(sum);
    return;
  }
  document.getElementById('htitle').textContent = p.sec || '';
  let html = '';
  if(p.sec) html += `<div class="sec">${esc(p.sec)}</div>`;
  if(p.note) html += `<p class="note">${esc(p.note)}</p>`;
  for(const id of p.q) html += renderQ(qIndex[id]);
  main.innerHTML = html;
  bindQ(p.q);
  nav.innerHTML = `<button class="back" type="button" id="back">${esc(UI.back)}</button>
    <button class="next" type="button" id="go">${idx === pages.length-2 ? esc(UI.send) : esc(UI.next)}</button>`;
  document.getElementById('back').onclick = () => { idx--; render(); window.scrollTo(0,0); };
  document.getElementById('go').onclick = () => { idx++; render(); window.scrollTo(0,0); };

function esc(s){ return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function extraBox(q){
  if(!q.extra_long) return '';
  return `<p class="note">${esc(q.extra_long)}</p><textarea data-extra="${q.id}"></textarea>`;
}

function renderQ(q){
  const hint = q.hint ? `<span class="hint">${esc(q.hint)}</span>` : '';
  const note = q.note ? `<p class="note">${esc(q.note)}</p>` : '';
  let body = '';
  if(q.type === 'single' || q.type === 'multi'){
    const name = q.id;
    const type = q.type === 'multi' ? 'checkbox' : 'radio';
    body = (q.opts||[]).map(o => {
      const lab = labelOf(o), val = valOf(o);
      return `<label class="opt" data-q="${name}" data-v="${esc(val)}"><input type="${type}" name="${name}" value="${esc(val)}"><span>${esc(lab)}</span></label>`;
    }).join('') + `<input class="other" data-other="${name}" placeholder="${esc(UI.otherPh)}">` + extraBox(q);
  } else if(q.type === 'long' || q.type === 'text'){
    body = `<textarea data-text="${q.id}" placeholder=""></textarea>`;
  } else if(q.type === 'matrix'){
    body = q.rows.map((r,ri) => `<div class="row"><b>${esc(r)}</b><select data-mx="${q.id}" data-row="${ri}"><option value="">—</option>${q.cols.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>`).join('')
      + `<input class="other" data-other="${q.id}" placeholder="${esc(UI.otherPh)}">`;
  } else if(q.type === 'nps'){
    body = `<div class="nps">${[...Array(11).keys()].map(n=>`<button type="button" data-nps="${q.id}" data-n="${n}">${n}</button>`).join('')}</div>
      <div class="npscap"><span>${esc(q.left||'')}</span><span>${esc(q.right||'')}</span></div>
      <input class="other" data-other="${q.id}" placeholder="${esc(UI.npsPh)}">`;
  } else if(q.type === 'multi_fill'){
    body = q.fills.map((f,i)=>`<div class="row"><b>${esc(f)}</b><input class="fill" data-fill="${q.id}" data-i="${i}"></div>`).join('');
  } else if(q.type === 'profile'){
    body = `<div class="row"><b>${esc(UI.age)}</b>${q.age.map(a=>`<label class="opt" data-q="${q.id}_age" data-v="${esc(a)}"><input type="radio" name="${q.id}_age" value="${esc(a)}"><span>${esc(a)}</span></label>`).join('')}</div>
      <div class="row"><b>${esc(UI.gender)}</b>${q.gender.map(a=>`<label class="opt" data-q="${q.id}_gender" data-v="${esc(a)}"><input type="radio" name="${q.id}_gender" value="${esc(a)}"><span>${esc(a)}</span></label>`).join('')}</div>`
      + q.fills.map((f,i)=>`<div class="row"><b>${esc(f)}</b><input class="fill" data-fill="${q.id}" data-i="${i}"></div>`).join('');
  }
  return `<div class="q" id="${q.id}"><h2>${q.n}. ${esc(q.title)} ${hint}</h2>${note}${body}</div>`;
}

function bindQ(ids){
  ids.forEach(id => {
    const q = qIndex[id];
    document.querySelectorAll(`input[name="${id}"]`).forEach(inp => {
      inp.onchange = () => {
        if(q.type === 'multi'){
          const max = q.max || 99;
          let checked = [...document.querySelectorAll(`input[name="${id}"]:checked`)].map(x=>x.value);
          if(checked.length > max){ inp.checked = false; checked = checked.filter(v=>v!==inp.value); }
          answers[id] = { v: checked, other: (answers[id]&&answers[id].other)||'' };
        } else {
          answers[id] = { v: inp.value, other: (answers[id]&&answers[id].other)||'' };
          if(id==='q2'){
            ['q3','q4','q5','q6','q7','q8','q9','q10','q11','q12','q13'].forEach(k => { delete answers[k]; });
          }
        }
        paint(id);
      };
    });
    const oth = document.querySelector(`[data-other="${id}"]`);
    if(oth){ oth.oninput = () => { answers[id] = Object.assign({v: answers[id]&&answers[id].v}, {other: oth.value}); }; }
    document.querySelectorAll(`[data-text="${id}"]`).forEach(t => t.oninput = () => { answers[id] = Object.assign({}, answers[id], {text: t.value}); });
    document.querySelectorAll(`[data-extra="${id}"]`).forEach(t => t.oninput = () => { answers[id] = Object.assign({}, answers[id], {extra: t.value}); });
    document.querySelectorAll(`[data-mx="${id}"]`).forEach(s => s.onchange = () => {
      const rows = {};
      document.querySelectorAll(`[data-mx="${id}"]`).forEach(x => { if(x.value) rows[q.rows[x.dataset.row]] = x.value; });
      answers[id] = Object.assign({}, answers[id], {matrix: rows});
    });
    document.querySelectorAll(`[data-nps="${id}"]`).forEach(b => b.onclick = () => {
      answers[id] = Object.assign({}, answers[id], {v: b.dataset.n});
      document.querySelectorAll(`[data-nps="${id}"]`).forEach(x => x.classList.toggle('on', x===b));
    });
    document.querySelectorAll(`[data-fill="${id}"]`).forEach(inp => inp.oninput = () => {
      const fills = [...document.querySelectorAll(`[data-fill="${id}"]`)].map(x=>x.value);
      answers[id] = Object.assign({}, answers[id], {fills});
    });
    document.querySelectorAll(`input[name="${id}_age"]`).forEach(inp => inp.onchange = () => { answers[id] = Object.assign({}, answers[id], {age: inp.value}); paint(id+'_age'); });
    document.querySelectorAll(`input[name="${id}_gender"]`).forEach(inp => inp.onchange = () => { answers[id] = Object.assign({}, answers[id], {gender: inp.value}); paint(id+'_gender'); });
    restore(q);
  });
}
function paint(name){
  document.querySelectorAll(`input[name="${name}"]`).forEach(inp => {
    const box = inp.closest('.opt');
    if(box) box.classList.toggle('on', inp.checked);
  });
}
function restore(q){
  const a = answers[q.id] || {};
  if(q.type==='multi' && Array.isArray(a.v)){
    a.v.forEach(v => { document.querySelectorAll(`input[name="${q.id}"]`).forEach(inp => { if(inp.value===v) inp.checked=true; }); });
    paint(q.id);
  } else if(q.type==='single' && a.v){
    document.querySelectorAll(`input[name="${q.id}"]`).forEach(inp => { if(inp.value===String(a.v)) inp.checked=true; });
    paint(q.id);
  }
  if(a.other){ const o=document.querySelector(`[data-other="${q.id}"]`); if(o) o.value=a.other; }
  if(a.text){ const t=document.querySelector(`[data-text="${q.id}"]`); if(t) t.value=a.text; }
  if(a.extra){ const t=document.querySelector(`[data-extra="${q.id}"]`); if(t) t.value=a.extra; }
  if(a.matrix){ document.querySelectorAll(`[data-mx="${q.id}"]`).forEach(s => { const lab=q.rows[s.dataset.row]; if(a.matrix[lab]) s.value=a.matrix[lab]; }); }
  if(q.type==='nps' && a.v!=null){ document.querySelectorAll(`[data-nps="${q.id}"]`).forEach(b => b.classList.toggle('on', b.dataset.n===String(a.v))); }
  if(a.fills){ document.querySelectorAll(`[data-fill="${q.id}"]`).forEach((inp,i)=>{ if(a.fills[i]) inp.value=a.fills[i]; }); }
  if(a.age){ document.querySelectorAll(`input[name="${q.id}_age"]`).forEach(inp => { if(inp.value===a.age) inp.checked=true; }); paint(q.id+'_age'); }
  if(a.gender){ document.querySelectorAll(`input[name="${q.id}_gender"]`).forEach(inp => { if(inp.value===a.gender) inp.checked=true; }); paint(q.id+'_gender'); }
}

function formatSummary(){
  const lines = [UI.summaryHead, ''];
  DATA.forEach(q => {
    const a = answers[q.id];
    if(!a) return;
    const bits = [];
    if(Array.isArray(a.v)) bits.push(a.v.join('; '));
    else if(a.v!=null && a.v!=='') bits.push(String(a.v));
    if(a.matrix) Object.entries(a.matrix).forEach(([k,v]) => bits.push(k+': '+v));
    if(a.fills) a.fills.forEach((v,i)=>(v?bits.push((q.fills?q.fills[i]:i)+': '+v):0));
    if(a.age) bits.push(UI.ageBit+': '+a.age);
    if(a.gender) bits.push(UI.genderBit+': '+a.gender);
    if(a.text) bits.push(a.text);
    if(a.extra) bits.push(a.extra);
    if(a.other) bits.push(UI.otherBit+': '+a.other);
    if(!bits.filter(Boolean).length) return;
    lines.push(q.n + '. ' + q.title);
    bits.filter(Boolean).forEach(b => lines.push('  - ' + b));
    lines.push('');
  });
  return lines.join('\n');
}

const SHEET_URL = "https://script.google.com/macros/s/AKfycbyUSQjZQ-DaxJUYgO7oOPx4FTC3yURuqeDX7bHbVioTjIB4jzIi1u3Lxb4G0aa6S5reCQ/exec";
const SHEET_TOKEN = "4349fa9c45f1e77f82f60fee3ef4b515f85c3fe6da1695b3";
const SURVEY_LANG = "pt";

function surveyClientId(){
  const key = 'survey_client_' + SURVEY_LANG;
  try {
    let id = localStorage.getItem(key);
    if(!id){
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
      localStorage.setItem(key, id);
    }
    return id;
  } catch(e) {
    return String(Date.now());
  }
}

async function postSheet(summary){
  if(!SHEET_URL || !SHEET_TOKEN) return null;
  const payload = {
    token: SHEET_TOKEN,
    lang: SURVEY_LANG,
    client_id: surveyClientId(),
    summary: summary,
    json: answers
  };
  try {
    const res = await fetch(SHEET_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data && data.ok === true && data.row) return data;
  } catch(e) {}
  try {
    const url = SHEET_URL + (SHEET_URL.indexOf('?') >= 0 ? '&' : '?')
      + 'token=' + encodeURIComponent(SHEET_TOKEN)
      + '&lang=' + encodeURIComponent(SURVEY_LANG)
      + '&client_id=' + encodeURIComponent(payload.client_id);
    const check = await fetch(url, { method: 'GET', redirect: 'follow' });
    const data = await check.json();
    if(data && data.ok === true && data.row) return data;
  } catch(e) {}
  return null;
}

async function submitAnswers(summary){
  try{ localStorage.setItem('survey_last_' + SURVEY_LANG, summary); }catch(e){}
  const msg = document.getElementById('msg');
  const saved = await postSheet(summary);
  const wrap = document.getElementById('codewrap');
  if(saved){
    if(msg) msg.textContent = UI.sent;
    if(saved.code){
      const box = document.getElementById('codebox');
      const note = document.getElementById('codenote');
      const copyCode = document.getElementById('copycode');
      if(box) box.textContent = saved.code;
      if(note) note.style.display = 'none';
      if(copyCode) copyCode.style.display = 'block';
    }
    return;
  }
  if(wrap) wrap.style.display = 'none';
  if(msg) msg.textContent = UI.notSent;
}

render();
